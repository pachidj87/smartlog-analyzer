services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://smartlog:change-me@mongodb:27017/smartlog?authSource=admin}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

  mongodb:
    image: mongo:8.0-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-smartlog}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smartlog}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_INITDB_ROOT_USERNAME:-smartlog}",
          "--password",
          "${MONGO_INITDB_ROOT_PASSWORD:-change-me}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
